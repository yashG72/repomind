# Local stack: the RepoMind API plus a Qdrant server.
#   docker compose up --build
# Data persists in named volumes: vectors in `qdrant_data`, the downloaded embedding and
# reranking models in `model_cache` (so they are downloaded only once).
services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      REPOMIND_QDRANT_URL: http://qdrant:6333
      REPOMIND_EMBEDDING_CACHE_DIR: /models
    volumes:
      - model_cache:/models
    depends_on:
      qdrant:
        condition: service_started

  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
  model_cache:
