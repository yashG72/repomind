[project]
name = "repomind"
version = "0.1.0"
description = "Ask grounded, cited questions about public GitHub repositories."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.28.1",
    "sentence-transformers>=3.0",
    # Direct dependency so [tool.uv.sources] below can pick its index (CPU-only build).
    "torch>=2.4",
    "qdrant-client>=1.12",
    "anthropic>=1.13,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "httpx2>=2.16.0",
]

# PyTorch's PyPI wheels for Linux bundle CUDA (several GB). Linux and Windows use the CPU-only
# build from PyTorch's index instead; macOS keeps PyPI, whose wheels are CPU/MPS only.
# See https://docs.astral.sh/uv/guides/integration/pytorch/
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Emitted when tests deliberately point qdrant-client at an unreachable server.
    "ignore:Failed to obtain server version:UserWarning",
]
markers = [
    "integration: needs a real embedding model and/or Qdrant server (see tests/integration)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]  # asserts; seeded random for test data
